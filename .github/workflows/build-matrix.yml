name: Build Matrix

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
      - "0.2.0-alpha*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Hamlib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libhamlib-dev

      - name: Install Hamlib (macOS)
        if: runner.os == 'macOS'
        run: brew install hamlib

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DULTRA_BUILD_TESTS=ON
          -DULTRA_BUILD_TOOLS=OFF
          -DULTRA_BUILD_GUI=OFF
          -DULTRA_USE_FFTW=OFF

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Hamlib's prebuilt Windows headers include <pthread.h>, which MSVC
        # does not ship. Until we vendor a pthread.h shim or switch the
        # Windows CI build to MinGW, disable the libhamlib backend on
        # Windows CI test runs. The Hamlib NET rigctl (TCP) path stays
        # available; only the in-process built-in Hamlib driver is skipped.
        run: >
          cmake -S . -B build -A x64
          -DULTRA_BUILD_TESTS=ON
          -DULTRA_BUILD_TOOLS=OFF
          -DULTRA_BUILD_GUI=OFF
          -DULTRA_USE_FFTW=OFF
          -DULTRA_USE_LIBHAMLIB=OFF

      - name: Build Tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      - name: Build Tests (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Debug --parallel

      - name: Run CTest (Linux/macOS)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: Run CTest (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Debug --output-on-failure --parallel 4

  sanitizer:
    name: Sanitizer (linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Hamlib
        run: sudo apt-get update && sudo apt-get install -y libhamlib-dev

      - name: Configure ASAN/UBSAN
        run: >
          cmake -S . -B build-sanitizer
          -DCMAKE_BUILD_TYPE=Debug
          -DULTRA_BUILD_TESTS=ON
          -DULTRA_BUILD_TOOLS=OFF
          -DULTRA_BUILD_GUI=OFF
          -DULTRA_USE_FFTW=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build ASAN/UBSAN Tests
        run: cmake --build build-sanitizer --parallel

      - name: Run ASAN/UBSAN CTest
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitizer --output-on-failure --parallel 4

  coverage:
    name: Coverage (linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Coverage Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libhamlib-dev

      - name: Run Coverage Gate
        env:
          CC: clang
          CXX: clang++
          LLVM_COV: llvm-cov
          LLVM_PROFDATA: llvm-profdata
        run: ./scripts/coverage_report.sh

  build:
    name: Build (${{ matrix.target }})
    needs:
      - test
      - sanitizer
      - coverage
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgl1-mesa-dev libhamlib-dev

      - name: Install macOS GUI Dependencies
        if: runner.os == 'macOS'
        run: brew install sdl2 hamlib

      - name: Install Windows GUI Dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install sdl2:x64-windows
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DULTRA_BUILD_TESTS=OFF
          -DULTRA_BUILD_GUI=ON
          -DULTRA_USE_FFTW=OFF

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # ULTRA_USE_LIBHAMLIB=OFF on Windows release builds: Hamlib's
        # prebuilt Windows headers include <pthread.h> which MSVC does
        # not ship. Fixing this needs either a vendored pthread.h shim
        # or a MinGW-based Windows build. Tracked as a follow-up.
        # Operators on Windows can still use the Hamlib NET rigctl
        # (rigctld TCP) backend with an externally-installed rigctld.
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DULTRA_BUILD_TESTS=OFF
          -DULTRA_BUILD_GUI=ON
          -DULTRA_USE_FFTW=OFF
          -DULTRA_USE_LIBHAMLIB=OFF
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Collect Bundle Files
        shell: bash
        run: |
          set -euo pipefail
          ./packaging/package_operator_bundle.sh build "${{ matrix.target }}" package
          ls -la "package/projectultra-${{ matrix.target }}"
          ls -la "package/dev-tools-${{ matrix.target }}"

      - name: Create ZIP Bundle (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd package
          zip -r "projectultra-${{ matrix.target }}.zip" "projectultra-${{ matrix.target }}"
          zip -r "dev-tools-${{ matrix.target }}.zip" "dev-tools-${{ matrix.target }}"

      - name: Create ZIP Bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "package/projectultra-windows/*" -DestinationPath "package/projectultra-windows.zip" -Force
          Compress-Archive -Path "package/dev-tools-windows/*" -DestinationPath "package/dev-tools-windows.zip" -Force

      - name: Upload Operator Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: projectultra-${{ matrix.target }}
          path: package/projectultra-${{ matrix.target }}.zip
          if-no-files-found: error

      - name: Upload Dev Tools Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-tools-${{ matrix.target }}
          path: package/dev-tools-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: Publish Release Assets
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: projectultra-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
