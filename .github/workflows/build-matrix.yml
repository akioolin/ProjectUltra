name: Build Matrix

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
      - "0.2.0-alpha*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DULTRA_BUILD_TESTS=OFF
          -DULTRA_BUILD_GUI=OFF
          -DULTRA_USE_FFTW=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect Binaries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          found=0
          bins=(ultra cli_simulator threaded_simulator profile_acquisition test_waveform_simple)

          for b in "${bins[@]}"; do
            for p in "build/${b}" "build/Release/${b}" "build/${b}.exe" "build/Release/${b}.exe"; do
              if [[ -f "$p" ]]; then
                f="$(basename "$p")"
                if [[ "$f" == *.exe ]]; then
                  base="${f%.exe}"
                  ext=".exe"
                else
                  base="$f"
                  ext=""
                fi
                cp "$p" "dist/${base}-${{ matrix.target }}${ext}"
                found=1
              fi
            done
          done

          if [[ "$found" -eq 0 ]]; then
            echo "No built binaries were found in expected paths."
            exit 1
          fi

          ls -la dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: projectultra-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release Assets
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: projectultra-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
