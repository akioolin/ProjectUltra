name: Hardware follow-up proposal
description: Create a human-authored hardware/audio/PHY/ARQ task for Codex or Claude.
title: "Planner proposal: "
labels:
  - planner-proposal
  - needs-approval
  - manual-followup
  - hardware
body:
  - type: markdown
    attributes:
      value: |
        Use this for follow-ups based on Mac/Pi or agentic/Pi hardware logs.
        After creating the issue, comment `/approve codex` or `/approve claude`
        when it is ready to run. If blocked by an unmerged PR, do not approve yet.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the measurable hardware behavior target.
      placeholder: |
        Example: Reach 0 retx / 0 timeouts on AWGN quick sentinel across
        repeated runs after PR #21.
    validations:
      required: true

  - type: textarea
    id: current_metrics
    attributes:
      label: Current metrics
      description: Paste the exact latest metrics row(s).
      placeholder: |
        case status rc channel snr rate bytes retransmissions timeouts frame_success_pct peak_backlog_ms
        awgn_1k_r12_snr15 pass 0 awgn 15 r1_2 1024 2 1 100.0 3480.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and reports
      description: Include exact local paths on the agent machine.
      placeholder: |
        - Report: agents/reports/...
        - Hardware log dir: /tmp/ultra_hw_...
        - Relevant PR: #21
    validations:
      required: true

  - type: textarea
    id: known_events
    attributes:
      label: Known events to explain
      description: List exact frames, sequence numbers, or symptoms the task must explain.
      placeholder: |
        - seq=4 fast-hole retransmit
        - seq=8 timeout retransmit
    validations:
      required: false

  - type: textarea
    id: blockers
    attributes:
      label: Blockers
      placeholder: |
        Do not approve until PR #21 is merged into main.
    validations:
      required: false

  - type: textarea
    id: allowed_files
    attributes:
      label: Allowed files
      placeholder: |
        - src/protocol/...
        - src/gui/modem/streaming_decoder.cpp only if logs prove PHY/decode timing.
        - tests/...
        - agents/run_hardware_sentinel.sh only for stricter reporting.
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      value: |
        - Do not weaken sentinel thresholds.
        - Do not hide retransmissions from metrics.
        - Do not tune audio calibration constants from one run.
        - Do not broaden this into generic throughput work.
    validations:
      required: true

  - type: textarea
    id: local_gate
    attributes:
      label: Required local gate
      value: |
        ```bash
        ./agents/run_local_gate.sh
        ```
    validations:
      required: true

  - type: textarea
    id: hardware_gate
    attributes:
      label: Required hardware or benchmark gate
      value: |
        ```bash
        SSH_KEY="$HOME/.ssh/id_pi5" ./agents/run_hardware_sentinel.sh
        ```
    validations:
      required: true

  - type: textarea
    id: reject_conditions
    attributes:
      label: Reject conditions
      placeholder: |
        - No comparison of ALPHA and BRAVO logs.
        - No root-cause classification.
        - Success is claimed from one lucky run when repeated evidence is required.
        - Fix only changes thresholds or reporting.
    validations:
      required: true

  - type: textarea
    id: expected_output
    attributes:
      label: Expected output
      placeholder: |
        - Root-cause classification with exact A/B log evidence.
        - Patch or precise next task.
        - Before/after hardware metrics.
        - Repeated-run evidence if the target is 0/0.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This task names the exact latest hardware report/logs.
          required: true
        - label: This task states the measurable hardware target.
          required: true
        - label: I will approve with `/approve codex` or `/approve claude` only when ready to run.
          required: true
