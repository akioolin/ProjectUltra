name: Agent follow-up proposal
description: Create a human-authored bounded task for Codex or Claude.
title: "Planner proposal: "
labels:
  - planner-proposal
  - needs-approval
  - manual-followup
body:
  - type: markdown
    attributes:
      value: |
        Use this when you want to create the next agent task yourself instead
        of waiting for the planner. After creating the issue, comment
        `/approve codex` or `/approve claude` when it is ready to run.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the production outcome. Prefer measurable behavior.
      placeholder: |
        Example: Eliminate residual AWGN retransmissions after PR #21 so the
        quick wired hardware sentinel reaches 0 retx / 0 timeouts.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include exact PRs, commits, reports, logs, and metrics.
      placeholder: |
        - Depends on PR: #21
        - Report: agents/reports/...
        - Hardware log: /tmp/ultra_hw_...
        - Current result: ...
    validations:
      required: true

  - type: textarea
    id: blockers
    attributes:
      label: Blockers
      description: If this must wait for a PR merge or external action, state it clearly.
      placeholder: |
        Do not approve until PR #21 is merged into main.
    validations:
      required: false

  - type: textarea
    id: allowed_files
    attributes:
      label: Allowed files
      description: Keep the write scope narrow.
      placeholder: |
        - src/protocol/...
        - tests/...
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      placeholder: |
        - Do not weaken thresholds.
        - Do not rewrite unrelated subsystems.
        - Do not push directly to main.
    validations:
      required: true

  - type: textarea
    id: local_gate
    attributes:
      label: Required local gate
      value: |
        ```bash
        ./agents/run_local_gate.sh
        ```
    validations:
      required: true

  - type: textarea
    id: hardware_gate
    attributes:
      label: Required hardware or benchmark gate
      description: State exact command or write Not required.
      placeholder: |
        ```bash
        SSH_KEY="$HOME/.ssh/id_pi5" ./agents/run_hardware_sentinel.sh
        ```
    validations:
      required: true

  - type: textarea
    id: reject_conditions
    attributes:
      label: Reject conditions
      placeholder: |
        - No root-cause classification.
        - No before/after metrics.
        - Fix only changes thresholds or hides failures.
    validations:
      required: true

  - type: textarea
    id: expected_output
    attributes:
      label: Expected output
      placeholder: |
        - Root-cause classification with exact evidence.
        - Patch or precise next task.
        - Gate results and residual risks.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This is one bounded task, not a broad project goal.
          required: true
        - label: The task says when to run hardware or benchmark gates.
          required: true
        - label: I will approve with `/approve codex` or `/approve claude` only when ready to run.
          required: true
